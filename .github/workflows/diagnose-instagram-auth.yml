name: Diagnose Instagram authorization (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Read-only Meta authorization diagnostic
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: python3 diagnose_auth.py
